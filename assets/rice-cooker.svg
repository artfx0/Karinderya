<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <!-- Sleepy Classic Rice Cooker with Floral print and Unplugged Cord -->
  <ellipse cx="80" cy="132" rx="46" ry="8" fill="#E8D7B9"/>

  <!-- Feet -->
  <rect x="48" y="122" width="10" height="6" rx="3" fill="#3A2417"/>
  <rect x="102" y="122" width="10" height="6" rx="3" fill="#3A2417"/>

  <!-- Cooker Main Body -->
  <rect x="38" y="66" width="84" height="58" rx="16" fill="#FFFDF8" stroke="#3A2417" stroke-width="2.5"/>
  <!-- Base ring -->
  <path d="M38 116 Q80 122 122 116 L122 120 Q80 126 38 120 Z" fill="#E8D7B9" stroke="#3A2417" stroke-width="1"/>

  <!-- Metal Lid -->
  <path d="M42 66 Q80 54 118 66 Z" fill="#D6D6D6" stroke="#3A2417" stroke-width="2.5"/>
  <ellipse cx="80" cy="54" rx="8" ry="4" fill="#3A2417"/>

  <!-- Sleepy Eyes on front panel -->
  <path d="M58 84 Q63 89 68 84" stroke="#3A2417" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M92 84 Q97 89 102 84" stroke="#3A2417" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- Sweet smile -->
  <path d="M77 92 Q80 95 83 92" stroke="#3A2417" stroke-width="2" fill="none" stroke-linecap="round"/>
  <ellipse cx="54" cy="88" rx="4" ry="2.5" fill="#FF8A65" opacity="0.6"/>
  <ellipse cx="106" cy="88" rx="4" ry="2.5" fill="#FF8A65" opacity="0.6"/>

  <!-- Cooker Switch Panel (Cook / Warm indicator lights - both OFF) -->
  <rect x="68" y="98" width="24" height="20" rx="4" fill="#EFEBE9" stroke="#8D6E63" stroke-width="1.5"/>
  <circle cx="74" cy="104" r="2.5" fill="#BDBDBD"/>
  <text x="74" y="114" font-family="sans-serif" font-size="5" text-anchor="middle" fill="#757575">COOK</text>
  <circle cx="86" cy="104" r="2.5" fill="#BDBDBD"/>
  <text x="86" y="114" font-family="sans-serif" font-size="5" text-anchor="middle" fill="#757575">WARM</text>

  <!-- Side Handle -->
  <rect x="33" y="80" width="6" height="18" rx="3" fill="#3A2417"/>
  <rect x="121" y="80" width="6" height="18" rx="3" fill="#3A2417"/>

  <!-- Vintage Flower Decal -->
  <circle cx="50" cy="106" r="3" fill="#F48FB1"/>
  <circle cx="48" cy="103" r="2" fill="#F8BBD0"/>
  <circle cx="52" cy="103" r="2" fill="#F8BBD0"/>
  <circle cx="48" cy="109" r="2" fill="#F8BBD0"/>
  <circle cx="52" cy="109" r="2" fill="#F8BBD0"/>
  <circle cx="50" cy="106" r="1.5" fill="#FFF59D"/>

  <!-- Unplugged Power Cord curling to the side -->
  <path d="M124 114 Q138 120 134 134 Q130 144 142 140" stroke="#424242" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Two plug prongs -->
  <rect x="142" y="137" width="5" height="6" rx="1.5" fill="#212121"/>
  <line x1="147" y1="139" x2="151" y2="139" stroke="#B0BEC5" stroke-width="1.5"/>
  <line x1="147" y1="142" x2="151" y2="142" stroke="#B0BEC5" stroke-width="1.5"/>

  <!-- Zzz floating -->
  <text x="115" y="44" font-family="'Fredoka', sans-serif" font-size="12" font-weight="bold" fill="#6A4F3F" opacity="0.8">z</text>
  <text x="124" y="32" font-family="'Fredoka', sans-serif" font-size="16" font-weight="bold" fill="#6A4F3F" opacity="0.6">Z</text>
  <text x="134" y="18" font-family="'Fredoka', sans-serif" font-size="20" font-weight="bold" fill="#3A2417">Z</text>
</svg>
