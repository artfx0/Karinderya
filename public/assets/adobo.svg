<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="adoboBroth" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7A3611"/>
      <stop offset="70%" stop-color="#4F1C04"/>
      <stop offset="100%" stop-color="#2D0F02"/>
    </radialGradient>
    <linearGradient id="meatGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D2691E"/>
      <stop offset="60%" stop-color="#8B4513"/>
      <stop offset="100%" stop-color="#5C2605"/>
    </linearGradient>
    <linearGradient id="bayLeaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#556B2F"/>
      <stop offset="100%" stop-color="#2E4010"/>
    </linearGradient>
  </defs>
  <!-- Banana Leaf / Plate -->
  <circle cx="80" cy="80" r="76" fill="#2E7D32"/>
  <circle cx="80" cy="80" r="70" fill="#388E3C" stroke="#1B5E20" stroke-width="2"/>
  <!-- Leaf veins -->
  <path d="M80 15 Q80 80 80 145" stroke="#2E7D32" stroke-width="2.5" fill="none"/>
  <path d="M80 40 Q50 35 25 45 M80 70 Q45 65 20 80 M80 100 Q50 100 25 120" stroke="#2E7D32" stroke-width="1.5" fill="none"/>
  <path d="M80 40 Q110 35 135 45 M80 70 Q115 65 140 80 M80 100 Q110 100 135 120" stroke="#2E7D32" stroke-width="1.5" fill="none"/>

  <!-- Bowl / Palayok Rim -->
  <ellipse cx="80" cy="84" rx="55" ry="46" fill="#B3541E" stroke="#7A3008" stroke-width="3"/>
  <ellipse cx="80" cy="82" rx="51" ry="42" fill="url(#adoboBroth)"/>

  <!-- Chicken cuts -->
  <!-- Piece 1 -->
  <path d="M52 64 C42 66 38 80 48 88 C58 96 74 92 72 78 C70 66 60 62 52 64 Z" fill="url(#meatGrad)" stroke="#4A1C04" stroke-width="1.5"/>
  <circle cx="56" cy="74" r="3" fill="#FFE4B5" opacity="0.4"/>
  <!-- Piece 2 -->
  <path d="M78 68 C70 70 70 86 82 92 C94 98 112 90 108 76 C105 64 88 64 78 68 Z" fill="url(#meatGrad)" stroke="#4A1C04" stroke-width="1.5"/>
  <ellipse cx="94" cy="78" rx="8" ry="5" fill="#FFE4B5" opacity="0.3" transform="rotate(-15 94 78)"/>
  <!-- Drumstick bone knob -->
  <circle cx="114" cy="82" r="5" fill="#FBF0D9" stroke="#8B5A2B" stroke-width="1"/>
  <circle cx="114" cy="88" r="4.5" fill="#FBF0D9" stroke="#8B5A2B" stroke-width="1"/>

  <!-- Bay Leaf (Dahon ng Laura) -->
  <path d="M62 82 Q75 72 92 84 Q78 94 62 82 Z" fill="url(#bayLeaf)" stroke="#1C2E05" stroke-width="1"/>
  <path d="M64 82 L90 84" stroke="#7CB342" stroke-width="0.8"/>

  <!-- Garlic cloves & peppercorns (Paminta) -->
  <circle cx="68" cy="62" r="2.5" fill="#1A110B"/>
  <circle cx="86" cy="60" r="2.2" fill="#1A110B"/>
  <circle cx="102" cy="70" r="2.4" fill="#1A110B"/>
  <circle cx="60" cy="94" r="2" fill="#1A110B"/>
  <ellipse cx="76" cy="95" rx="5" ry="3.5" fill="#FFF2D6" stroke="#C49F64" stroke-width="1"/>
  
  <!-- Gloss / sauce shine -->
  <path d="M48 72 Q54 68 62 70" stroke="#FFF" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
  <path d="M84 72 Q92 70 98 74" stroke="#FFF" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
</svg>
