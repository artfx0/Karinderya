<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <!-- Cheerful Palayok (Clay Pot) Mascot with Chef Toque -->
  <defs>
    <radialGradient id="potGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E06928"/>
      <stop offset="60%" stop-color="#C93500"/>
      <stop offset="100%" stop-color="#801C00"/>
    </radialGradient>
  </defs>

  <!-- Mascot Body (Rounded Clay Pot) -->
  <ellipse cx="80" cy="100" rx="46" ry="38" fill="url(#potGrad)" stroke="#521400" stroke-width="3"/>
  <ellipse cx="80" cy="74" rx="36" ry="10" fill="#E06928" stroke="#521400" stroke-width="2.5"/>
  <!-- Pot handles (ears) -->
  <path d="M34 94 C24 94 24 106 34 106" stroke="#521400" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M126 94 C136 94 136 106 126 106" stroke="#521400" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Cute Eyes -->
  <ellipse cx="64" cy="96" rx="5" ry="7" fill="#3A2417"/>
  <ellipse cx="96" cy="96" rx="5" ry="7" fill="#3A2417"/>
  <circle cx="66" cy="94" r="2.2" fill="#FFF"/>
  <circle cx="98" cy="94" r="2.2" fill="#FFF"/>

  <!-- Rosy cheeks -->
  <ellipse cx="54" cy="104" rx="6" ry="3.5" fill="#FF7043" opacity="0.6"/>
  <ellipse cx="106" cy="104" rx="6" ry="3.5" fill="#FF7043" opacity="0.6"/>

  <!-- Happy Smiling Mouth -->
  <path d="M72 104 Q80 114 88 104" stroke="#3A2417" stroke-width="2.5" fill="#801C00" stroke-linecap="round"/>

  <!-- Chef Hat (Toque) -->
  <path d="M54 70 L106 70 L102 62 L58 62 Z" fill="#FFFDF8" stroke="#D1C4B2" stroke-width="2"/>
  <path d="M54 62 C46 54 50 36 64 38 C68 26 92 26 96 38 C110 36 114 54 106 62 Z" fill="#FFFDF8" stroke="#D1C4B2" stroke-width="2.5"/>
  <!-- Hat puff folds -->
  <path d="M72 40 Q74 54 72 62" stroke="#E6D7C3" stroke-width="1.5" fill="none"/>
  <path d="M88 40 Q86 54 88 62" stroke="#E6D7C3" stroke-width="1.5" fill="none"/>

  <!-- Wooden Ladle held by mascot -->
  <g transform="rotate(25 120 80)">
    <rect x="116" y="50" width="6" height="50" rx="3" fill="#A0522D" stroke="#5C2E14" stroke-width="1.5"/>
    <ellipse cx="119" cy="48" rx="10" ry="13" fill="#CD853F" stroke="#5C2E14" stroke-width="1.5"/>
  </g>
</svg>
